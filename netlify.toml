[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/"

[headers.values]
Link = "</.well-known/api-catalog.json>; rel=\"api-catalog\"; type=\"application/linkset+json\", </feed.xml>; rel=\"alternate\"; type=\"application/rss+xml\"; title=\"Blog RSS feed\", </feed.json>; rel=\"alternate\"; type=\"application/feed+json\"; title=\"Blog JSON feed\""

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "https://antfu.dev/*"
to = "https://antfu.me/:splat"
status = 302
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
